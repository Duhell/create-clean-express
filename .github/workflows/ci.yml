name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Smoke test — CLI help
        run: node bin/cex.js --help

      - name: Smoke test — scaffold a project
        run: node bin/cex.js new smoke-test --no-install --no-git

      - name: Smoke test — generate a resource
        working-directory: smoke-test
        run: node ../bin/cex.js make resource User

      - name: Smoke test — generate auth
        working-directory: smoke-test
        run: node ../bin/cex.js make auth

      - name: Verify generated files exist
        run: |
          test -f smoke-test/src/controllers/UserController.js
          test -f smoke-test/src/services/UserService.js
          test -f smoke-test/src/repositories/UserRepository.js
          test -f smoke-test/src/routes/user.routes.js
          test -f smoke-test/src/controllers/AuthController.js
          test -f smoke-test/src/middleware/AuthMiddleware.js
          echo "All expected files exist ✔"
