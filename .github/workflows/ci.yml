name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Smoke test — CLI help
        run: node bin/cex.js --help

      - name: Smoke test — scaffold JS project
        run: node bin/cex.js new smoke-test --database none --no-install --no-git

      - name: Smoke test — generate a resource (JS)
        working-directory: smoke-test
        run: node ../bin/cex.js make resource User

      - name: Smoke test — generate auth (JS)
        working-directory: smoke-test
        run: node ../bin/cex.js make auth

      - name: Verify generated JS files exist
        run: |
          test -f smoke-test/src/controllers/UserController.js
          test -f smoke-test/src/services/UserService.js
          test -f smoke-test/src/repositories/UserRepository.js
          test -f smoke-test/src/routes/user.routes.js
          test -f smoke-test/src/controllers/AuthController.js
          test -f smoke-test/src/middleware/AuthMiddleware.js
          test -f smoke-test/src/utils/logger.js
          echo "All expected JS files exist ✔"

      - name: Smoke test — scaffold TS project
        run: node bin/cex.js new smoke-test-ts --database sqlite --typescript --no-install --no-git

      - name: Smoke test — generate a resource (TS)
        working-directory: smoke-test-ts
        run: node ../bin/cex.js make resource User

      - name: Verify generated TS files exist
        run: |
          test -f smoke-test-ts/src/controllers/UserController.ts
          test -f smoke-test-ts/src/services/UserService.ts
          test -f smoke-test-ts/src/repositories/UserRepository.ts
          test -f smoke-test-ts/src/routes/user.routes.ts
          test -f smoke-test-ts/src/utils/logger.ts
          echo "All expected TS files exist ✔"
